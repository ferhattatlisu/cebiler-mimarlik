<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çebiler Mimarlık — örnek tasarımlar</title>
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111;
         font: 400 17px/1.5 "Inter Tight", system-ui, sans-serif; }
  main { width: min(560px, 100% - 48px); padding: 48px 0; }
  h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
  p { margin: 0 0 32px; color: #555; }
  a { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 20px 0;
      border-top: 1px solid #111; color: inherit; text-decoration: none; font-size: 20px; font-weight: 500; }
  a:last-of-type { border-bottom: 1px solid #111; }
  a span { font-size: 15px; font-weight: 400; color: #555; }
</style>
</head>
<body>
<main>
  <h1>Çebiler Mimarlık</h1>
  <p>tekTıkla tarafından hazırlanan iki örnek web sitesi. Projeler ve görseller temsilidir.</p>
